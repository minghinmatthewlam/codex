<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Remote Control</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6efe3;
  --panel: #fffaf1;
  --ink: #29231c;
  --muted: #7a6b59;
  --line: #dfcfba;
  --accent: #2f6f63;
  --accent-dark: #24564d;
  --user: #ead9c3;
  --assistant: #fff7ea;
  --tool: #eee1d0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,0.72), transparent 34rem),
    linear-gradient(180deg, #faf3e7 0%, var(--bg) 48%, #eadcc8 100%);
  color: var(--ink);
}
.shell {
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
header {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 14px 16px 10px;
  border-bottom: 1px solid rgba(146, 122, 91, 0.22);
  background: rgba(250, 243, 231, 0.88);
  backdrop-filter: blur(18px);
}
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0;
}
.pill {
  border: 1px solid rgba(47, 111, 99, 0.22);
  background: rgba(47, 111, 99, 0.12);
  color: var(--accent-dark);
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 650;
}
.cwd {
  margin-top: 6px;
  min-height: 18px;
  color: var(--muted);
  font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.messages {
  width: min(820px, 100%);
  margin: 0 auto;
  padding: 18px 14px 112px;
}
.empty {
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 18px;
  background: rgba(255, 250, 241, 0.62);
}
.fork-command {
  margin: 0 0 14px;
  border: 1px solid rgba(47, 111, 99, 0.28);
  border-radius: 8px;
  padding: 12px;
  background: rgba(255, 250, 241, 0.82);
}
.fork-command .label {
  margin-bottom: 6px;
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 700;
}
.fork-command code {
  display: block;
  color: var(--ink);
  font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow-wrap: anywhere;
}
.message {
  margin: 0 0 12px;
  display: flex;
}
.message.user { justify-content: flex-end; }
.bubble {
  max-width: min(92%, 680px);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  line-height: 1.42;
  box-shadow: 0 1px 0 rgba(41, 35, 28, 0.04);
}
.user .bubble {
  background: var(--user);
  border-color: #d7c0a4;
}
.assistant .bubble {
  background: var(--assistant);
}
.tool .bubble,
.status .bubble {
  background: var(--tool);
  color: #5f5142;
  font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
}
details.bubble {
  display: block;
}
details.bubble summary {
  cursor: pointer;
  font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #5f5142;
  list-style: none;
}
details.bubble summary::-webkit-details-marker {
  display: none;
}
details.bubble summary::before {
  content: "›";
  display: inline-block;
  margin-right: 7px;
  transform: translateY(-1px);
}
details.bubble[open] summary::before {
  transform: rotate(90deg) translateX(1px);
}
details.bubble pre {
  margin: 9px 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: inherit;
}
form {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 12px max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid rgba(146, 122, 91, 0.24);
  background: rgba(250, 243, 231, 0.9);
  backdrop-filter: blur(18px);
}
.composer {
  width: min(820px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
}
textarea {
  width: 100%;
  min-height: 48px;
  max-height: 148px;
  resize: none;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #cdb89d;
  background: var(--panel);
  color: inherit;
  font: inherit;
  line-height: 1.34;
  outline: none;
}
textarea:focus {
  border-color: rgba(47, 111, 99, 0.64);
  box-shadow: 0 0 0 3px rgba(47, 111, 99, 0.12);
}
button {
  min-width: 72px;
  min-height: 48px;
  border: 0;
  border-radius: 8px;
  background: var(--accent);
  color: #fffaf1;
  font: inherit;
  font-weight: 700;
}
button:disabled {
  background: #b9ab9a;
}
.fork-button {
  min-width: 0;
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid rgba(47, 111, 99, 0.26);
  background: rgba(47, 111, 99, 0.12);
  color: var(--accent-dark);
  font-size: 13px;
}
.fork-button:disabled {
  background: rgba(145, 128, 105, 0.16);
  color: var(--muted);
}
.share-button {
  min-width: 0;
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid rgba(146, 122, 91, 0.3);
  background: rgba(255, 250, 241, 0.82);
  color: var(--muted);
  font-size: 13px;
}
.readonly-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 14px max(12px, env(safe-area-inset-bottom));
  border-top: 1px solid rgba(146, 122, 91, 0.24);
  background: rgba(250, 243, 231, 0.92);
  color: var(--muted);
  font-size: 13px;
  backdrop-filter: blur(18px);
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="topline">
      <h1>Codex</h1>
      <div class="actions">
        <button class="fork-button" id="fork" type="button" disabled>Fork</button>
        <button class="share-button" id="share" type="button">Share</button>
        <div class="pill" id="connection">Connecting</div>
      </div>
    </div>
    <div class="cwd" id="cwd"></div>
  </header>
  <main class="messages" id="messages">
    <div class="empty">Loading the Codex transcript from your laptop...</div>
  </main>
  <form id="form">
    <div class="composer">
      <textarea id="message" rows="1" autofocus placeholder="Message Codex"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
  <div class="readonly-bar" id="readonly" hidden>
    Read-only share view. Watch live, or fork to continue on your computer.
  </div>
</div>
<script>
const token = __TOKEN_JSON__;
const accessMode = __ACCESS_MODE_JSON__;
const shareUrl = __SHARE_URL_JSON__;
const canControl = accessMode === "controller";
const message = document.getElementById("message");
const form = document.getElementById("form");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const connection = document.getElementById("connection");
const cwd = document.getElementById("cwd");
const fork = document.getElementById("fork");
const share = document.getElementById("share");
const readonly = document.getElementById("readonly");
let lastSnapshot = null;
let lastForkCommand = null;

if (!canControl) {
  form.hidden = true;
  readonly.hidden = false;
}

function tokenParam() {
  return `token=${encodeURIComponent(token)}`;
}

function render(snapshot) {
  lastSnapshot = snapshot;
  connection.textContent = snapshot.status || "Connected";
  cwd.textContent = snapshot.cwd || "";
  fork.disabled = !snapshot.fork?.available;
  if (!snapshot.messages || snapshot.messages.length === 0) {
    messages.replaceChildren(...forkCommandNodes(), emptyNode("No transcript yet."));
    return;
  }
  messages.replaceChildren(...forkCommandNodes(), ...snapshot.messages.map((item) => {
    const row = document.createElement("div");
    row.className = `message ${item.role || "status"}`;
    const bubble = bubbleForItem(item);
    row.appendChild(bubble);
    return row;
  }));
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
}

function bubbleForItem(item) {
  const role = item.role || "status";
  if (role === "tool" || role === "status") {
    const details = document.createElement("details");
    details.className = "bubble";
    const summary = document.createElement("summary");
    summary.textContent = role === "tool" ? "Tool output" : "Session status";
    const body = document.createElement("pre");
    body.textContent = item.text || "";
    details.append(summary, body);
    return details;
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = item.text || "";
  return bubble;
}

function emptyNode(text) {
  const node = document.createElement("div");
  node.className = "empty";
  node.textContent = text;
  return node;
}

function forkCommandNodes() {
  if (!lastForkCommand) return [];
  const wrapper = document.createElement("div");
  wrapper.className = "fork-command";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Run on the other laptop";
  const code = document.createElement("code");
  code.textContent = lastForkCommand;
  wrapper.append(label, code);
  return [wrapper];
}

async function loadState() {
  const response = await fetch(`/api/state?${tokenParam()}`);
  if (!response.ok) throw new Error(`state ${response.status}`);
  render(await response.json());
}

function connectEvents() {
  const events = new EventSource(`/api/events?${tokenParam()}`);
  events.addEventListener("open", () => {
    connection.textContent = lastSnapshot?.status || "Connected";
  });
  events.addEventListener("snapshot", (event) => {
    render(JSON.parse(event.data));
  });
  events.addEventListener("error", () => {
    connection.textContent = "Reconnecting";
  });
}

message.addEventListener("input", () => {
  message.style.height = "auto";
  message.style.height = `${Math.min(message.scrollHeight, 148)}px`;
});

message.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!canControl) return;
  const text = message.value.trim();
  if (!text) return;
  send.disabled = true;
  connection.textContent = "Sending";
  const response = await fetch(`/api/message?${tokenParam()}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });
  send.disabled = false;
  if (!response.ok) {
    connection.textContent = `Failed ${response.status}`;
    return;
  }
  message.value = "";
  message.style.height = "auto";
  connection.textContent = "Sent";
});

fork.addEventListener("click", async () => {
  fork.disabled = true;
  connection.textContent = "Forking";
  const response = await fetch(`/api/fork?${tokenParam()}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" }
  });
  if (!response.ok) {
    connection.textContent = `Fork failed ${response.status}`;
    render(lastSnapshot || { messages: [], fork: { available: false } });
    return;
  }
  const payload = await response.json();
  lastForkCommand = payload.command;
  connection.textContent = "Fork ready";
  render(lastSnapshot || { messages: [], fork: { available: true } });
});

share.addEventListener("click", async () => {
  try {
    if (navigator.share) {
      await navigator.share({ title: "Codex session", url: shareUrl });
      connection.textContent = "Share sheet opened";
      return;
    }
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(shareUrl);
      connection.textContent = "Share link copied";
      return;
    }
  } catch (_) {
    connection.textContent = "Share canceled";
  }
  window.prompt("Share this read-only link", shareUrl);
});

loadState().catch(() => {
  connection.textContent = "Offline";
});
connectEvents();
</script>
</body>
</html>
